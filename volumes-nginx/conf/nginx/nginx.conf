events {}

http {
    include mime.types;
    server {
        # Koyeb manda el trafico al puerto 8000 por defecto.
        # El HTTPS lo gestiona la plataforma (su proxy pone el certificado), aqui solo HTTP.
        listen 8000;
        root /usr/share/nginx/html;

        location /miscosas {
            root /usr/share/nginx/html;
        }
        # alias: /mascosas sirve el contenido de la carpeta miscosas
        location /mascosas {
            alias /usr/share/nginx/html/miscosas;
        }
        location /otrascosas {
            root /usr/share/nginx/html;
            try_files /otrascosas/cosas.html /otrascosas/alternativa.html =404;
        }

        # REDIRECT: la URL cambia en el navegador
        location /cositas {
            return 307 /otrascosas;
        }

        # REWRITE 1: cualquier cosa que empiece por "otra" va a /otrascosas
        rewrite ^/otra.* /otrascosas;

        # REWRITE 2: /number/5 -> /count/5 (la URL no cambia en el navegador)
        rewrite ^/number/(\w+) /count/$1;

        # REWRITE 3: primera parte = consonante + hasta 4 alfanumericos (1 a 5 en total)
        rewrite "(?i)^/[b-df-hj-np-tv-z][a-z0-9]{0,4}/([0-9])$" /count/$1;

        location ~* /count/[0-9] {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }
    }
}
